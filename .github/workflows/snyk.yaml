# Disabled: this fork has no SNYK_TOKEN secret configured, so every run fails
# immediately with no useful output. Re-enable by switching `on:` back to
# `push` once a token is added (repo Settings > Secrets and variables > Actions).
name: "Snyk"
on: workflow_dispatch
jobs:
  snyk:
    name: "Snyk"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        continue-on-error: true # To make sure that SARIF upload gets called
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif

      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
